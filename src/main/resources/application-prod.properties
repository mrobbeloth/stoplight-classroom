# Production profile
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema owned by Flyway; Hibernate validates only.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

admin.default-username=${ADMIN_USERNAME}
admin.default-password=${ADMIN_PASSWORD}

# CORS — set via env var, comma-separated list of origin patterns
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator — expose only health/info publicly
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.security.user.name=unused
spring.security.user.password=unused

# Mail (optional). EmailService logs instead of sending when mail.from is blank.
mail.from=${MAIL_FROM:}
mail.admin-notification-address=${MAIL_ADMIN_NOTIFICATION:}
app.base-url=${APP_BASE_URL:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Rate limits (per IP).
ratelimit.login.capacity=${RATELIMIT_LOGIN_CAPACITY:10}
ratelimit.login.window-seconds=${RATELIMIT_LOGIN_WINDOW:60}
ratelimit.signup.capacity=${RATELIMIT_SIGNUP_CAPACITY:3}
ratelimit.signup.window-seconds=${RATELIMIT_SIGNUP_WINDOW:3600}

server.port=${PORT:8080}
