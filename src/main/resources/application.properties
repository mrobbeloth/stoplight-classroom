# Application
spring.application.name=stoplight-classroom

# Database (default H2 for dev, override with env vars for PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:stoplight;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console (dev only)
spring.h2.console.enabled=${H2_CONSOLE:true}

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-must-be-at-least-256-bits-long!!}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Admin seed (login with these on the Teacher Login page)
admin.default-username=${ADMIN_USERNAME:admin}
admin.default-password=${ADMIN_PASSWORD:changeme}

# Suppress Spring Security's auto-generated password (we use JWT)
spring.security.user.name=unused
spring.security.user.password=unused

# Server
server.port=${PORT:8080}
