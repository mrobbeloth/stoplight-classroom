# Application
spring.application.name=stoplight-classroom

# Database (default H2 for dev, override with env vars for PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:stoplight;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Schema is owned by Flyway; Hibernate only validates that entities match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway. baseline-on-migrate lets existing pre-Flyway databases adopt V1 as the
# baseline without re-running CREATE TABLE.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# H2 console (dev only)
spring.h2.console.enabled=${H2_CONSOLE:true}

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-must-be-at-least-256-bits-long!!}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Admin seed (login with these on the Teacher Login page)
admin.default-username=${ADMIN_USERNAME:admin}
admin.default-password=${ADMIN_PASSWORD:changeme}

# Suppress Spring Security's auto-generated password (we use JWT)
spring.security.user.name=unused
spring.security.user.password=unused

# Mail (optional). When mail.from is blank, EmailService logs instead of sending —
# keeps signup flows working in dev without an SMTP server.
mail.from=${MAIL_FROM:}
mail.admin-notification-address=${MAIL_ADMIN_NOTIFICATION:}
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Disable Spring's MailHealthIndicator. EmailService degrades gracefully on its own;
# letting the indicator probe SMTP makes /actuator/health return DOWN whenever mail
# isn't configured, which fails the ALB health check.
management.health.mail.enabled=false

# Rate limits (per IP, token bucket).
ratelimit.login.capacity=${RATELIMIT_LOGIN_CAPACITY:10}
ratelimit.login.window-seconds=${RATELIMIT_LOGIN_WINDOW:60}
ratelimit.signup.capacity=${RATELIMIT_SIGNUP_CAPACITY:3}
ratelimit.signup.window-seconds=${RATELIMIT_SIGNUP_WINDOW:3600}

# Server
server.port=${PORT:8080}
