<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login — Stoplight Classroom</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="container" style="padding-top: 3rem; max-width: 24rem;">
    <h1 class="text-center">🚦 Teacher Login</h1>
    <form id="loginForm" class="card">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div id="error" class="error-msg hidden"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
    </form>
    <p class="text-center mt-1">
        <a href="/signup" style="color: var(--muted);">New teacher? Request an account</a>
        &nbsp;·&nbsp;
        <a href="/" style="color: var(--muted);">← Back</a>
    </p>
</div>
<script src="/js/api.js"></script>
<script>
// If already logged in, go to dashboard
if (api.getToken()) window.location.href = '/dashboard';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('error');
    errEl.classList.add('hidden');
    try {
        const data = await api.post('/api/auth/login', {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
        });
        api.setToken(data.accessToken);
        localStorage.setItem('refreshToken', data.refreshToken);
        window.location.href = '/dashboard';
    } catch (err) {
        errEl.textContent = err.message || 'Invalid credentials';
        errEl.classList.remove('hidden');
    }
});
</script>
</body>
</html>
