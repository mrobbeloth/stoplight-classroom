<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Session — Stoplight Classroom</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
</head>
<body>
<nav class="navbar">
    <a href="/dashboard" class="navbar-brand">🚦 Stoplight Classroom</a>
    <div>
        <a href="/dashboard">← Courses</a>
        <a href="/dashboard/stats">Stats</a>
        <a href="#" id="logoutBtn">Logout</a>
    </div>
</nav>
<div class="container text-center">
    <!-- Join code -->
    <div class="card">
        <p class="text-muted">Share this code with students:</p>
        <div class="join-code" id="joinCode">------</div>
        <p class="student-count mt-1">Responses: <span id="totalCount">0</span></p>
    </div>

    <!-- Aggregate visualization -->
    <div class="card">
        <h2>Comprehension</h2>
        <div class="aggregate">
            <div class="aggregate-item">
                <div class="aggregate-bar">
                    <div class="aggregate-fill green" id="greenBar" style="height: 0%;"></div>
                </div>
                <div class="aggregate-count" id="greenCount">0</div>
                <div class="aggregate-label">Understand</div>
            </div>
            <div class="aggregate-item">
                <div class="aggregate-bar">
                    <div class="aggregate-fill yellow" id="yellowBar" style="height: 0%;"></div>
                </div>
                <div class="aggregate-count" id="yellowCount">0</div>
                <div class="aggregate-label">Partial</div>
            </div>
            <div class="aggregate-item">
                <div class="aggregate-bar">
                    <div class="aggregate-fill red" id="redBar" style="height: 0%;"></div>
                </div>
                <div class="aggregate-count" id="redCount">0</div>
                <div class="aggregate-label">Struggling</div>
            </div>
        </div>
    </div>

    <!-- Activity mode -->
    <div class="card">
        <h2>Activity Mode</h2>
        <div class="mode-selector">
            <button class="mode-btn" data-mode="GROUP" onclick="setMode('GROUP')">👥 Group</button>
            <button class="mode-btn" data-mode="PARTNER" onclick="setMode('PARTNER')">🤝 Partner</button>
            <button class="mode-btn" data-mode="SILENT" onclick="setMode('SILENT')">🔇 Silent</button>
        </div>
    </div>

    <!-- End session -->
    <button class="btn btn-danger" id="endBtn" style="margin-top: 1rem;">End Session</button>
    <div id="ended" class="card hidden mt-2">
        <p><strong>Session ended.</strong></p>
        <a href="/dashboard" class="btn btn-primary mt-1">Back to Dashboard</a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
if (!api.getToken()) window.location.href = '/login';

const sessionId = window.location.pathname.split('/').pop();
let currentMode = 'SILENT';

// Load session info
api.get('/api/sessions/' + sessionId).then(data => {
    document.getElementById('joinCode').textContent = data.joinCode;
    updateMode(data.activityMode);
    if (data.status === 'ENDED') showEnded();
}).catch(() => window.location.href = '/dashboard');

// Load initial aggregate
api.get('/api/sessions/' + sessionId + '/aggregate').then(updateAggregate).catch(() => {});

// WebSocket for live aggregate updates
const socket = new SockJS('/ws');
const stompClient = Stomp.over(socket);
stompClient.debug = null;
stompClient.connect({}, () => {
    stompClient.subscribe('/topic/session/' + sessionId + '/aggregate', (msg) => {
        updateAggregate(JSON.parse(msg.body));
    });
});

function updateAggregate(agg) {
    const total = agg.total || 1;
    document.getElementById('greenCount').textContent = agg.green;
    document.getElementById('yellowCount').textContent = agg.yellow;
    document.getElementById('redCount').textContent = agg.red;
    document.getElementById('totalCount').textContent = agg.total;
    document.getElementById('greenBar').style.height = (agg.green / total * 100) + '%';
    document.getElementById('yellowBar').style.height = (agg.yellow / total * 100) + '%';
    document.getElementById('redBar').style.height = (agg.red / total * 100) + '%';
}

function updateMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
        b.classList.toggle(b.dataset.mode, b.dataset.mode === mode);
    });
}

async function setMode(mode) {
    try {
        const data = await api.put('/api/sessions/' + sessionId + '/activity-mode', { activityMode: mode });
        updateMode(data.activityMode);
    } catch (err) { alert(err.message); }
}

document.getElementById('endBtn').addEventListener('click', async () => {
    if (!confirm('End this session?')) return;
    try {
        await api.put('/api/sessions/' + sessionId + '/end');
        showEnded();
    } catch (err) { alert(err.message); }
});

function showEnded() {
    document.getElementById('endBtn').classList.add('hidden');
    document.getElementById('ended').classList.remove('hidden');
}

document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    api.clearToken();
    localStorage.removeItem('refreshToken');
    window.location.href = '/login';
});
</script>
</body>
</html>
