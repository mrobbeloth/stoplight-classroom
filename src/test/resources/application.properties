# Test configuration (H2 in-memory in PostgreSQL compatibility mode so the same Flyway
# migrations that run against Postgres in prod also run cleanly here).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.h2.console.enabled=false

jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-signing!!
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

admin.default-username=admin
admin.default-password=testpassword
