name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: stoplight-classroom-prod
  ECS_CLUSTER: stoplight-classroom-prod-cluster
  ECS_SERVICE: stoplight-classroom-prod-svc
  TASK_FAMILY: stoplight-classroom-prod-app
  CONTAINER_NAME: app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build and test
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Capture current task definition for rollback
        id: capture-previous
        run: |
          set -euo pipefail
          previous=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text)
          echo "previous_task_def=$previous" >> "$GITHUB_OUTPUT"
          echo "Captured previous task definition: $previous"

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test — production health
        id: smoke-test
        env:
          HEALTH_URL: https://stoplightonline.com/actuator/health
        run: |
          set -euo pipefail
          # ECS already reported stable, but DNS/ALB propagation can lag a few seconds.
          # Retry up to 6 times (~1 minute total). Fail the workflow if health stays down
          # so a bad rollout doesn't get marked as a successful deploy.
          for attempt in 1 2 3 4 5 6; do
            response=$(curl -sS --max-time 10 -w "\n%{http_code}" "$HEALTH_URL" || true)
            status=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            echo "attempt $attempt: status=$status body=$body"
            if [ "$status" = "200" ] && printf '%s' "$body" | grep -q '"status":"UP"'; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed: production health did not return UP after 6 attempts"
          exit 1

      - name: Rollback ECS service on failure
        if: failure() && steps.capture-previous.outputs.previous_task_def != ''
        env:
          PREVIOUS_TASK_DEF: ${{ steps.capture-previous.outputs.previous_task_def }}
        run: |
          set -euo pipefail
          echo "Rolling service $ECS_SERVICE back to $PREVIOUS_TASK_DEF"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK_DEF" \
            --force-new-deployment >/dev/null
          echo "Waiting for rollback to stabilize (this can take several minutes)..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
          echo "Rollback completed. Service is running $PREVIOUS_TASK_DEF again."
